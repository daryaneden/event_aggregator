services:

  db:
    image: postgres:15
    container_name: events_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_daryaneden-events-aggregator-postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d student_daryaneden-events-aggregator-postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  db-test:
    image: postgres:15
    container_name: events_db_test
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_daryaneden-events-aggregator-postgres-test

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d student_daryaneden-events-aggregator-postgres-test"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: events_app
    restart: always

    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_daryaneden-events-aggregator-postgres

      EVENT_PROVIDER_URL: ${EVENT_PROVIDER_URL}
      EVENT_PROVIDER_API_KEY: ${EVENT_PROVIDER_API_KEY}

    volumes:
      - .:/app
      - /app/.venv

  tests:
    build: .
    container_name: events_tests

    command: >
      sh -c "
        uv run alembic upgrade head &&
        uv run pytest tests
      "

    depends_on:
      db-test:
        condition: service_healthy

    environment:
      POSTGRES_HOST: db-test
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: student_daryaneden-events-aggregator-postgres-test

      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@db-test:5432/student_daryaneden-events-aggregator-postgres-test

    volumes:
      - .:/app
      - /app/.venv


volumes:
  postgres_data: