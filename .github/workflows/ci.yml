name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # =========================
  # LINT
  # =========================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check app


  # =========================
  # UNIT TESTS
  # =========================

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    env:
        EVENT_PROVIDER_URL: "http://test-provider"
        EVENT_PROVIDER_API_KEY: "test-api-key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/application


  # =========================
  # INFRASTRUCTURE TESTS
  # =========================

  infrastructure-test:
    name: Infrastructure tests
    runs-on: ubuntu-latest
    needs: lint

    env:
        EVENT_PROVIDER_URL: "http://test-provider"
        EVENT_PROVIDER_API_KEY: "test-api-key"

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: student_daryaneden-events-aggregator-postgres-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - "5432:5432"

        options: >-
          --health-cmd "pg_isready -U postgres -d student_daryaneden-events-aggregator-postgres-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run infrastructure tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/student_daryaneden-events-aggregator-postgres-test
        run: uv run pytest tests/infrastructure

  # =========================
  # E2E TESTS
  # =========================

  e2e-test:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run E2E tests
        run: uv run pytest tests/E2E


  # =========================
  # BUILD
  # =========================

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs:
      - lint
      - unit-test
      - infrastructure-test
      - e2e-test

    outputs:
      repo: ${{ steps.repo.outputs.repo }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================
  # DEPLOY
  # =========================

  deploy:
    name: Deploy to LMS
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Send deploy request
        run: |
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.LMS_API_KEY }}" \
            -d '{"image":"ghcr.io/${{ needs.build.outputs.repo }}:${{ github.sha }}","repository":"${{ github.repository }}"}' \
            https://lms.python-labs.ru/api/deploy-requests

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment failed with status code $HTTP_CODE"
            echo "Response body:"
            cat response.txt
            exit 1
          fi

